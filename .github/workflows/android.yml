name: Unity ANDROID - sealed output and private logs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private source ref or commit SHA'
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: simple-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        github.repository == vars.CI_REPOSITORY &&
        vars.SOURCE_REPOSITORY == 'Goose-Egg-Studio/Simple' &&
        contains(fromJSON(vars.ALLOWED_BUILD_ACTORS || '[]'), github.actor) &&
        contains(fromJSON(vars.ALLOWED_BUILD_ACTORS || '[]'), github.triggering_actor)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: android-build
    steps:
      - name: Checkout public CI launcher
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - name: Create private log directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/simple-private-logs"
          printf 'Platform: android\nRun: %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/simple-private-logs/build-status.txt"

      - name: Install encryption tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq age >/dev/null 2>&1 || { echo 'crypto tool installation failed'; exit 1; }

      - name: Unseal CI implementation
        shell: bash
        env:
          CI_AGE_IDENTITY: ${{ secrets.CI_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/simple-ci-private-age-identity"
          TMP="$RUNNER_TEMP/simple-ci-private-scripts.tar.gz"
          trap 'rm -f "$KEY" "$TMP"' EXIT
          test -n "$CI_AGE_IDENTITY" || { echo 'CI identity missing'; exit 1; }
          printf '%s\n' "$CI_AGE_IDENTITY" > "$KEY"
          mkdir -p "$RUNNER_TEMP/secure-ci"
          age -d -i "$KEY" -o "$TMP" ci/ci/sealed/secure-ci-scripts.tar.age > "$RUNNER_TEMP/simple-private-logs/ci-unseal.log" 2>&1 || { echo 'sealed CI could not be unlocked'; exit 1; }
          tar -xzf "$TMP" -C "$RUNNER_TEMP/secure-ci" > "$RUNNER_TEMP/simple-private-logs/ci-extract.log" 2>&1 || { echo 'sealed CI could not be extracted'; exit 1; }
          test -x "$RUNNER_TEMP/secure-ci/scripts/checkout-source.sh"

      - name: Install GameCI CLI privately (pinned installer)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/game-ci-installer"
          LOG="$RUNNER_TEMP/simple-private-logs/gameci-install.log"
          mkdir -p "$ROOT/scripts" "$RUNNER_TEMP/simple-private-logs"
          {
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/game-ci/cli/a9d35fd6cfae06bc130dcd49a48ccb8509197e38/scripts/install.sh" \
              --output "$ROOT/scripts/install.sh"
            export GAME_CI_INSTALL="$RUNNER_TEMP/game-ci/bin"
            bash "$ROOT/scripts/install.sh" "v0.1.48" "$GAME_CI_INSTALL"
            test -x "$GAME_CI_INSTALL/game-ci"
            "$GAME_CI_INSTALL/game-ci" --help >/dev/null 2>&1
          } >"$LOG" 2>&1 || { echo 'GameCI CLI installation failed; see encrypted diagnostics'; exit 1; }
          echo "$RUNNER_TEMP/game-ci/bin" >> "$GITHUB_PATH"
          echo 'GameCI CLI installed.'

      - name: Generate read-only source token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Checkout private Unity source silently
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          umask 077
          bash "$RUNNER_TEMP/secure-ci/scripts/checkout-source.sh" > "$RUNNER_TEMP/simple-private-logs/source-checkout.log" 2>&1 || { echo 'private checkout failed; encrypted diagnostics will be provided'; exit 1; }

      - name: Validate project without public source details
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/secure-ci/scripts/validate-simple.sh" project > "$RUNNER_TEMP/simple-private-logs/source-validation.log" 2>&1
          bash "$RUNNER_TEMP/secure-ci/scripts/check-version.sh" project 2022.3.62f3 >> "$RUNNER_TEMP/simple-private-logs/source-validation.log" 2>&1

      - name: Build privately and retain diagnostics
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSE_BASE64: ${{ secrets.UNITY_LICENSE_BASE64 }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          SIMPLE_CI_LOG_DIR: ${{ runner.temp }}/simple-private-logs
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${UNITY_LICENSE_BASE64:-}" ]; then
            UNITY_LICENSE="$(
              python3 - <<'PY_LICENSE' 2>"$RUNNER_TEMP/simple-private-logs/license-prep.log"
          import base64
          import os
          import sys
          import xml.etree.ElementTree as ET
          
          try:
              raw = base64.b64decode(os.environ["UNITY_LICENSE_BASE64"].strip(), validate=True)
              ET.fromstring(raw)
              sys.stdout.write(raw.decode("utf-8-sig"))
          except Exception as exc:
              print(f"Unity license Base64 preparation failed: {type(exc).__name__}", file=sys.stderr)
              sys.exit(1)
          PY_LICENSE
            )" || { echo 'Unity license preparation failed; see encrypted diagnostics'; exit 1; }
            export UNITY_LICENSE
          fi
          unset UNITY_LICENSE_BASE64
          # Record only whether online-activation credentials reached this step.
          # Never record values or hash/length information.
          {
            for name in UNITY_SERIAL UNITY_EMAIL UNITY_PASSWORD; do
              if [[ -n "${!name-}" ]]; then
                printf '%s=present\n' "$name"
              else
                printf '%s=missing\n' "$name"
              fi
            done
          } > "$RUNNER_TEMP/simple-private-logs/licensing-input-check.txt"

          # Preflight: no secret values or lengths are ever printed.
          for name in UNITY_SERIAL UNITY_EMAIL UNITY_PASSWORD \
                      ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS \
                      ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            if [[ -z "${!name-}" ]]; then
              echo 'CI preflight failed: a required license/signing secret is missing in android-build Environment.'
              exit 1
            fi
          done
          echo 'CI preflight passed: license and Android signing credentials configured.'

          # The monitor writes the entire Unity stdout/stderr to a PRIVATE file,
          # and emits only allow-listed phase names and known error categories
          # to the public GitHub Actions console. Never tail or grep raw lines
          # into public stdout, even during failure.
          echo 'Starting sealed Unity build with safe live progress reporting.'
          if ! python3 -u ci/ci/safe-progress.py \
              --log "$RUNNER_TEMP/simple-private-logs/unity-build.log" \
              --heartbeat 60 -- \
              bash "$RUNNER_TEMP/secure-ci/scripts/cli-build-android.sh"; then
            if grep -Fq 'Failed to build Addressables content' "$RUNNER_TEMP/simple-private-logs/unity-build.log" ||
               grep -Fq 'Addressable content build failure' "$RUNNER_TEMP/simple-private-logs/unity-build.log"; then
              echo 'Addressables content build failed; player outputs are incomplete. See age-encrypted diagnostics.'
            elif grep -Fq 'Requesting activation (professional license)' "$RUNNER_TEMP/simple-private-logs/unity-build.log"; then
              printf 'gameci-activation-branch=online-serial\n' >> "$RUNNER_TEMP/simple-private-logs/licensing-input-check.txt"
              echo 'Unity online serial activation was attempted; see encrypted diagnostics for the result.'
            elif grep -Fq 'Requesting activation (personal license)' "$RUNNER_TEMP/simple-private-logs/unity-build.log"; then
              printf 'gameci-activation-branch=ulf-import\n' >> "$RUNNER_TEMP/simple-private-logs/licensing-input-check.txt"
              if [[ -n "${UNITY_SERIAL-}" && -n "${UNITY_EMAIL-}" && -n "${UNITY_PASSWORD-}" ]]; then
                echo 'GameCI did not select online activation despite credentials reaching the workflow step; check encrypted diagnostics for forwarding.'
              else
                echo 'GameCI selected Personal ULF import; check which credential is missing in the encrypted diagnostics.'
              fi
              # The GameCI activation script captures Unity's detailed stdout internally.
              # Reproduce license import once without private source, keeping all output encrypted.
              echo 'Unity Personal activation failed; collecting private diagnostics.'
              mkdir -p "$RUNNER_TEMP/simple-private-logs/licensing-client"
              timeout 120s docker run --rm \
                --env UNITY_LICENSE \
                --env "CI_LOG_OWNER_UID=$(id -u)" \
                --env "CI_LOG_OWNER_GID=$(id -g)" \
                --volume "$RUNNER_TEMP/simple-private-logs/licensing-client:/ci-licensing-logs" \
                --entrypoint /bin/bash \
                unityci/editor:ubuntu-2022.3.62f3-android-3 \
                -c '
                  umask 077
                  save_licensing_logs() {
                    for item in \
                      "$HOME/.config/unity3d/Unity/Unity.Licensing.Client.log" \
                      "$HOME/.config/unity3d/Unity/Unity.Entitlements.Audit.log" \
                      "$HOME/.config/unity3d/Editor.log"; do
                      if [ -f "$item" ]; then
                        cp "$item" "/ci-licensing-logs/$(basename "$item")" || true
                      fi
                    done
                    rm -f /tmp/UnityLicenseFile.ulf
                    # Container runs as root; return private log ownership to the host runner.
                    chown -R "$CI_LOG_OWNER_UID:$CI_LOG_OWNER_GID" /ci-licensing-logs || true
                  }
                  trap save_licensing_logs EXIT
                  printf "%s\n" "$UNITY_LICENSE" > /tmp/UnityLicenseFile.ulf
                  unity-editor -batchmode -nographics -logFile /dev/stdout -quit \
                    -manualLicenseFile /tmp/UnityLicenseFile.ulf
                ' > "$RUNNER_TEMP/simple-private-logs/unity-license-debug.log" 2>&1 || true
            else
              printf 'gameci-activation-branch=unknown\n' >> "$RUNNER_TEMP/simple-private-logs/licensing-input-check.txt"
              echo 'Unity build failed before a recognizable activation branch or during compilation; see encrypted diagnostics.'
            fi
            echo 'build failed; download encrypted diagnostics'
            exit 1
          fi
          # Independent fail-closed gate, even if a monitor or future GameCI
          # version incorrectly returns success. Never print matching raw lines.
          if grep -Fq 'Failed to build Addressables content' "$RUNNER_TEMP/simple-private-logs/unity-build.log" ||
             grep -Fq 'Addressable content build failure' "$RUNNER_TEMP/simple-private-logs/unity-build.log"; then
            echo '::error title=Simple CI Addressables::Addressables content build failed; APK/AAB must not be released.'
            exit 1
          fi
          echo 'Unity build command completed; final artifact checks are handled by sealed CI.'

      # Always upload an encrypted bundle, even if source checkout or Unity fails.
      # A hard runner shutdown, cancellation, or inability to install age is not recoverable.
      - name: Encrypt outputs and private logs (success or failure)
        if: always()
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/simple-private-logs" encrypted
          printf 'Finalizer started; job status: %s\n' "${{ job.status }}" >> "$RUNNER_TEMP/simple-private-logs/build-status.txt"
          # Also repair files if Docker timed out or its EXIT trap did not complete.
          if [ -d "$RUNNER_TEMP/simple-private-logs/licensing-client" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/simple-private-logs/licensing-client"
            chmod -R go-rwx "$RUNNER_TEMP/simple-private-logs/licensing-client"
          fi
          test -x "$(command -v age)" || { echo 'artifact encryption tool unavailable'; exit 1; }
          # Capture Unity's persistent Editor.log, if it exists, inside the encrypted bundle.
          for f in "$HOME/Library/Logs/Unity/Editor.log" "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/simple-private-logs/editor.log"; fi
          done
          python3 - <<'PY_TAR' | age -r "$(cat ci/ci/artifact-recipient.txt)" -o "encrypted/android-${{ github.run_id }}.tar.age"
          import os, sys, tarfile
          home = os.environ['RUNNER_TEMP']
          workspace = os.environ['GITHUB_WORKSPACE']
          logs = os.path.join(home, 'simple-private-logs')
          artifacts = os.path.join(workspace, 'dist')
          with tarfile.open(fileobj=sys.stdout.buffer, mode='w|') as tf:
              tf.add(logs, arcname='private-logs')
              if os.path.isdir(artifacts):
                  tf.add(artifacts, arcname='build-outputs')
          PY_TAR
          test -s "encrypted/android-${{ github.run_id }}.tar.age" || exit 1
          echo 'Encrypted diagnostics and available outputs sealed.'

      - name: Upload encrypted package only
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-sealed-${{ github.run_id }}
          path: encrypted/*.tar.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
