name: Unity ANDROID - sealed output and private logs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private source ref or commit SHA'
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: simple-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        github.repository == vars.CI_REPOSITORY &&
        vars.SOURCE_REPOSITORY == 'Goose-Egg-Studio/Simple' &&
        contains(fromJSON(vars.ALLOWED_BUILD_ACTORS || '[]'), github.actor) &&
        contains(fromJSON(vars.ALLOWED_BUILD_ACTORS || '[]'), github.triggering_actor)
      }}
    runs-on: macos-26-intel
    timeout-minutes: 180
    environment: android-build
    steps:
      - name: Checkout public CI launcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false

      - name: Create private log directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/simple-private-logs"
          printf 'Platform: android\nRun: %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/simple-private-logs/build-status.txt"

      - name: Validate selected private source ref
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          python3 ci/ci/validate-source-ref.py --ref "$SOURCE_REF"

      - name: Install encryption tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/simple-private-logs"
          {
            brew list --versions age >/dev/null 2>&1 || brew install age
            # GameCI macOS helper script uses modern Bash features (macOS
            # ships an old Bash 3.2 by default).
            brew list --versions bash >/dev/null 2>&1 || brew install bash
          } > "$RUNNER_TEMP/simple-private-logs/crypto-install.log" 2>&1 || { echo 'macOS CLI prerequisites installation failed; see encrypted diagnostics'; exit 1; }
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          command -v age >/dev/null || { echo 'age binary missing'; exit 1; }
          echo 'Encryption tool ready.'

      # Bootstrap public Unity binaries before loading any decrypted private
      # CI scripts, credentials, or game source onto the runner filesystem.
      # Install the external GameCI tool before placing decrypted CI code,
      # application source or any App token on this runner filesystem.
      # macOS 26 Intel runner images can crash-loop iconservicesagent during
      # a file-icon request. This reproduces Unity's NSWorkspace call, applies
      # only a temporary per-user workaround on failure, and verifies it.
      # Do this BEFORE any expensive Unity download and private source checkout.
      - name: Verify macOS 26 IconServices before Unity
        shell: bash
        env:
          SIMPLE_CI_LOG_DIR: ${{ runner.temp }}/simple-private-logs
        run: |
          set -euo pipefail
          umask 077
          python3 ci/ci/preflight-iconservices-macos.py

      - name: Install GameCI CLI privately (pinned installer)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/game-ci-installer"
          LOG="$RUNNER_TEMP/simple-private-logs/gameci-install.log"
          mkdir -p "$ROOT/scripts" "$RUNNER_TEMP/simple-private-logs"
          {
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/game-ci/cli/a9d35fd6cfae06bc130dcd49a48ccb8509197e38/scripts/install.sh" \
              --output "$ROOT/scripts/install.sh"
            export GAME_CI_INSTALL="$RUNNER_TEMP/game-ci/bin"
            bash "$ROOT/scripts/install.sh" "v0.1.48" "$GAME_CI_INSTALL"
            test -x "$GAME_CI_INSTALL/game-ci"
            "$GAME_CI_INSTALL/game-ci" --help >/dev/null 2>&1
          } >"$LOG" 2>&1 || { echo 'GameCI CLI installation failed; see encrypted diagnostics'; exit 1; }
          echo "$RUNNER_TEMP/game-ci/bin" >> "$GITHUB_PATH"
          echo 'GameCI CLI installed.'

      # GameCI v0.1.48 deletes its bundled BlankProject after every native
      # macOS build. AAB's second license activation then receives an empty
      # directory and Unity reports "Couldn't set project path to:".
      # Patch the installed public CLI only, before private code is loaded.
      - name: Preserve GameCI activation project across APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 ci/ci/fix-gameci-macos-activation-project.py \
            > "$RUNNER_TEMP/simple-private-logs/gameci-activation-project-fix.log" 2>&1 || {
            echo 'GameCI multi-build activation project check failed; see encrypted diagnostics.'
            exit 1
          }
          echo 'GameCI macOS APK/AAB activation project reuse verified.'

      # Use Unity's standalone CLI, not the Hub's legacy headless downloader.
      # The existing sealed GameCI script will find this installed Editor at
      # the standard path and skip its own Unity Hub Editor install.
      - name: Preinstall Unity Editor and Android modules (standalone Unity CLI)
        id: unity-preinstall
        shell: bash
        env:
          SIMPLE_CI_LOG_DIR: ${{ runner.temp }}/simple-private-logs
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/simple-private-logs"
          echo 'Preparing Android Unity toolchain using the standalone Unity CLI.'
          if ! python3 -u ci/ci/safe-progress.py \
              --log "$RUNNER_TEMP/simple-private-logs/unity-cli-install.log" \
              --health-log "$RUNNER_TEMP/simple-private-logs/health-install.jsonl" \
              --heartbeat 60 --max-no-phase 7200 --max-no-output 2700 \
              --min-free-gib 1.5 -- \
              bash ci/ci/preinstall-unity-macos.sh; then
            echo 'Standalone Unity CLI installation failed. See encrypted diagnostics.'
            exit 1
          fi
          echo 'Standalone Editor and Android support verified; starting private GameCI build.'

      - name: Unseal CI implementation
        shell: bash
        env:
          CI_AGE_IDENTITY: ${{ secrets.CI_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/simple-ci-private-age-identity"
          TMP="$RUNNER_TEMP/simple-ci-private-scripts.tar.gz"
          trap 'rm -f "$KEY" "$TMP"' EXIT
          test -n "$CI_AGE_IDENTITY" || { echo 'CI identity missing'; exit 1; }
          printf '%s\n' "$CI_AGE_IDENTITY" > "$KEY"
          mkdir -p "$RUNNER_TEMP/secure-ci"
          age -d -i "$KEY" -o "$TMP" ci/ci/sealed/secure-ci-scripts.tar.age > "$RUNNER_TEMP/simple-private-logs/ci-unseal.log" 2>&1 || { echo 'sealed CI could not be unlocked'; exit 1; }
          python3 ci/ci/safe-extract.py --archive "$TMP" --destination "$RUNNER_TEMP/secure-ci" > "$RUNNER_TEMP/simple-private-logs/ci-extract.log" 2>&1 || { echo 'sealed CI could not be extracted'; exit 1; }
          test -x "$RUNNER_TEMP/secure-ci/scripts/checkout-source.sh"
          # Native macOS implementation is separately age-sealed to preserve
          # the known-good Linux implementation for a quick rollback.
          MAC_TMP="$RUNNER_TEMP/simple-ci-macos-build.tar.gz"
          trap 'rm -f "$KEY" "$TMP" "$MAC_TMP"' EXIT
          age -d -i "$KEY" -o "$MAC_TMP" ci/ci/sealed/macos-android-extra.age > "$RUNNER_TEMP/simple-private-logs/macos-unseal.log" 2>&1 || { echo 'macOS build implementation could not be unlocked'; exit 1; }
          python3 ci/ci/safe-extract.py --archive "$MAC_TMP" --destination "$RUNNER_TEMP/secure-ci" > "$RUNNER_TEMP/simple-private-logs/macos-extract.log" 2>&1 || { echo 'macOS build implementation could not be extracted'; exit 1; }
          test -x "$RUNNER_TEMP/secure-ci/scripts/mac-build-android.sh"
          test -s "$RUNNER_TEMP/secure-ci/scripts/SimpleCISealedMacAndroid.cs"
          python3 ci/ci/fix-sealed-macos-addressables.py --path "$RUNNER_TEMP/secure-ci/scripts/SimpleCISealedMacAndroid.cs" > "$RUNNER_TEMP/simple-private-logs/addressables-namespace-fix.log" 2>&1 || { echo "Addressables CI helper check failed; see encrypted diagnostics"; exit 1; }
          python3 ci/ci/fix-sealed-macos-gameci-result.py --path "$RUNNER_TEMP/secure-ci/scripts/SimpleCISealedMacAndroid.cs" > "$RUNNER_TEMP/simple-private-logs/gameci-result-fix.log" 2>&1 || { echo "GameCI verified-player result check failed; see encrypted diagnostics"; exit 1; }

      - name: Generate read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Checkout private Unity source silently
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          umask 077
          bash "$RUNNER_TEMP/secure-ci/scripts/checkout-source.sh" > "$RUNNER_TEMP/simple-private-logs/source-checkout.log" 2>&1 || { echo 'private checkout failed; encrypted diagnostics will be provided'; exit 1; }

      - name: Validate project without public source details
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/secure-ci/scripts/validate-simple.sh" project > "$RUNNER_TEMP/simple-private-logs/source-validation.log" 2>&1
          bash "$RUNNER_TEMP/secure-ci/scripts/check-version.sh" project 2022.3.62f3 >> "$RUNNER_TEMP/simple-private-logs/source-validation.log" 2>&1

      - name: Build privately and retain diagnostics
        id: build
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSE_BASE64: ${{ secrets.UNITY_LICENSE_BASE64 }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          SIMPLE_CI_LOG_DIR: ${{ runner.temp }}/simple-private-logs
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${UNITY_LICENSE_BASE64:-}" ]; then
            UNITY_LICENSE="$(
              python3 - <<'PY_LICENSE' 2>"$RUNNER_TEMP/simple-private-logs/license-prep.log"
          import base64
          import os
          import sys
          import xml.etree.ElementTree as ET
          
          try:
              raw = base64.b64decode(os.environ["UNITY_LICENSE_BASE64"].strip(), validate=True)
              ET.fromstring(raw)
              sys.stdout.write(raw.decode("utf-8-sig"))
          except Exception as exc:
              print(f"Unity license Base64 preparation failed: {type(exc).__name__}", file=sys.stderr)
              sys.exit(1)
          PY_LICENSE
            )" || { echo 'Unity license preparation failed; see encrypted diagnostics'; exit 1; }
            export UNITY_LICENSE
          fi
          unset UNITY_LICENSE_BASE64
          # Record only whether online-activation credentials reached this step.
          # Never record values or hash/length information.
          {
            for name in UNITY_SERIAL UNITY_EMAIL UNITY_PASSWORD; do
              if [[ -n "${!name-}" ]]; then
                printf '%s=present\n' "$name"
              else
                printf '%s=missing\n' "$name"
              fi
            done
          } > "$RUNNER_TEMP/simple-private-logs/licensing-input-check.txt"

          # Preflight: no secret values or lengths are ever printed.
          for name in UNITY_SERIAL UNITY_EMAIL UNITY_PASSWORD \
                      ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS \
                      ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            if [[ -z "${!name-}" ]]; then
              echo 'CI preflight failed: a required license/signing secret is missing in android-build Environment.'
              exit 1
            fi
          done
          echo 'CI preflight passed: license and Android signing credentials configured.'

          # macOS Intel: native Unity Hub/Editor via GameCI, not Linux Docker.
          # The decrypted editor script explicitly builds Addressables,
          # validates its encrypted bundle manifest, and signs APK/AAB.
          # All Unity/Hub output stays private; public logs show safe markers.
          echo 'Starting sealed macOS Unity build with safe live progress reporting.'
          if ! python3 -u ci/ci/safe-progress.py \
              --log "$RUNNER_TEMP/simple-private-logs/unity-build.log" \
              --health-log "$RUNNER_TEMP/simple-private-logs/health.jsonl" \
              --heartbeat 60 --max-no-phase 3600 --max-no-output 1800 \
              --diagnose-after 600 --min-free-gib 1.5 -- \
              bash "$RUNNER_TEMP/secure-ci/scripts/mac-build-android.sh"; then
            echo 'macOS Unity build failed; see age-encrypted diagnostics.'
            exit 1
          fi
          # Independent fail-closed gate, even if a monitor or future GameCI
          # version incorrectly returns success. Never print matching raw lines.
          if grep -Fq 'Failed to build Addressables content' "$RUNNER_TEMP/simple-private-logs/unity-build.log" ||
             grep -Fq 'Addressable content build failure' "$RUNNER_TEMP/simple-private-logs/unity-build.log"; then
            echo '::error title=Simple CI Addressables::Addressables content build failed; APK/AAB must not be released.'
            exit 1
          fi
          echo 'Unity build command completed; final artifact checks are handled by sealed CI.'

      # APK, AAB, and private logs are three separate compressed and age-encrypted
      # packages, each uploaded to its own GitHub Actions Artifact. No plaintext
      # payload or Unity log is ever uploaded.
      - name: Seal APK independently
        id: seal_apk
        if: ${{ success() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p encrypted
          python3 ci/ci/seal-android.py --kind apk |
            age -r "$(cat ci/ci/artifact-recipient.txt)" -o "encrypted/android-apk-${{ github.run_id }}.tar.gz.age"
          test -s "encrypted/android-apk-${{ github.run_id }}.tar.gz.age"
          echo 'APK archive encrypted separately.'

      - name: Upload sealed APK only
        if: ${{ always() && steps.seal_apk.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk-sealed-${{ github.run_id }}
          path: encrypted/android-apk-${{ github.run_id }}.tar.gz.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Seal AAB independently
        id: seal_aab
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p encrypted
          python3 ci/ci/seal-android.py --kind aab |
            age -r "$(cat ci/ci/artifact-recipient.txt)" -o "encrypted/android-aab-${{ github.run_id }}.tar.gz.age"
          test -s "encrypted/android-aab-${{ github.run_id }}.tar.gz.age"
          echo 'AAB archive encrypted separately.'

      - name: Upload sealed AAB only
        if: ${{ always() && steps.seal_aab.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-aab-sealed-${{ github.run_id }}
          path: encrypted/android-aab-${{ github.run_id }}.tar.gz.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # Attempt to preserve diagnostics even after a build/packaging failure.
      # Runner termination or manual cancellation still cannot guarantee this.
      - name: Seal private diagnostics independently
        id: seal_logs
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/simple-private-logs" encrypted
          # Collect Unity Hub's installation logs before age encryption.
          # Hub logging is separate from the Unity Editor.log.
          python3 ci/ci/capture-unity-hub.py > /dev/null 2>&1 || true
          printf 'Finalizer started; job status: %s\n' "${{ job.status }}" >> "$RUNNER_TEMP/simple-private-logs/build-status.txt"
          if [ -d "$RUNNER_TEMP/simple-private-logs/licensing-client" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/simple-private-logs/licensing-client" || true
            chmod -R go-rwx "$RUNNER_TEMP/simple-private-logs/licensing-client" || true
          fi
          # Never print or upload the raw Editor.log.
          for f in "$HOME/Library/Logs/Unity/Editor.log" "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$f" ]; then
              cp "$f" "$RUNNER_TEMP/simple-private-logs/editor.log" 2>/dev/null || true
            fi
          done
          test -x "$(command -v age)" || { echo 'Encryption tool unavailable'; exit 1; }
          python3 ci/ci/seal-android.py --kind logs |
            age -r "$(cat ci/ci/log-recipient.txt)" -o "encrypted/android-logs-${{ github.run_id }}.tar.gz.age"
          test -s "encrypted/android-logs-${{ github.run_id }}.tar.gz.age"
          echo 'Private diagnostics encrypted separately.'

      - name: Upload sealed diagnostics only
        if: ${{ always() && steps.seal_logs.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-logs-sealed-${{ github.run_id }}
          path: encrypted/android-logs-${{ github.run_id }}.tar.gz.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Clean up encrypted staging
        if: ${{ always() }}
        shell: bash
        run: rm -f encrypted/android-*.tar.gz.age
