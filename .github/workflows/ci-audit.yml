name: Public CI safety checks

on:
  push:
    branches: [main]
    paths:
      - "ci/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "ci/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public CI sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Shell syntax and Python compilation
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/preinstall-unity-macos.sh
          python3 -m compileall -q ci tests
      - name: Public script regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
