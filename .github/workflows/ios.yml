name: Unity iOS - encrypted scripts and artifacts

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private source tag, branch or commit (commit SHA recommended)'
        type: string
        required: true
        default: main
      export_ipa:
        description: 'Sign IPA and upload to App Store Connect/TestFlight'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: unity-ios-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        github.repository == vars.CI_REPOSITORY &&
        vars.SOURCE_REPOSITORY == 'Goose-Egg-Studio/Simple' &&
        contains(fromJSON(vars.ALLOWED_BUILD_ACTORS || '[]'), github.actor) &&
        contains(fromJSON(vars.ALLOWED_BUILD_ACTORS || '[]'), github.triggering_actor)
      }}
    runs-on: macos-26-intel
    timeout-minutes: 180
    environment: ios-build
    steps:
      - name: Checkout public launcher and encrypted scripts
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - name: Select and verify Xcode 26.6
        shell: bash
        run: |-
          set -euo pipefail
          XCODE_DEVELOPER_DIR="/Applications/Xcode_26.6.app/Contents/Developer"
          if [[ ! -d "$XCODE_DEVELOPER_DIR" ]]; then
            echo "::error::Xcode 26.6 is not installed on this runner image"
            exit 1
          fi
          export DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          xcodebuild -version | grep -Fxq 'Xcode 26.6' || {
            echo "::error::Expected Xcode 26.6, got a different version"
            exit 1
          }
          xcodebuild -version | grep -Fxq 'Build version 17F113' || {
            echo "::error::Expected Xcode 26.6 build 17F113"
            exit 1
          }
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install crypto tools
        shell: bash
        run: |-
          brew install age

      - name: Unlock sealed CI scripts
        shell: bash
        env:
          CI_AGE_IDENTITY: ${{ secrets.CI_AGE_IDENTITY }}
        run: |-
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/age-ci-key"
          TAR="$RUNNER_TEMP/ci-code.tar.gz"
          trap 'rm -f "$KEY" "$TAR"' EXIT
          test -n "$CI_AGE_IDENTITY"
          printf '%s\n' "$CI_AGE_IDENTITY" > "$KEY"
          mkdir -p "$RUNNER_TEMP/secure-ci"
          age -d -i "$KEY" -o "$TAR" ci/ci/sealed/secure-ci-scripts.tar.age
          tar -xzf "$TAR" -C "$RUNNER_TEMP/secure-ci"
          test -x "$RUNNER_TEMP/secure-ci/scripts/check-version.sh"
          echo 'Encrypted CI implementation unlocked.'

      - name: Create read-only GitHub App token for private source and submodules
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Checkout private Unity project and recursive private submodules
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref }}
          token: ${{ steps.source-token.outputs.token }}
          path: project
          submodules: recursive
          lfs: true
          persist-credentials: false
          fetch-depth: 1

      - name: Complete nested Git LFS downloads
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ steps.source-token.outputs.token }}
        run: bash "$RUNNER_TEMP/secure-ci/scripts/finalize-checkout.sh" project

      - name: Validate Simple source, scenes and submodules
        shell: bash
        run: bash "$RUNNER_TEMP/secure-ci/scripts/validate-simple.sh" project

      - name: Enforce Unity version 2022.3.62f3
        shell: bash
        run: bash "$RUNNER_TEMP/secure-ci/scripts/check-version.sh" project 2022.3.62f3

      - name: Build Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: project
          unityVersion: 2022.3.62f3
          targetPlatform: iOS
          buildsPath: build-ios
          versioning: None

      - name: Unsigned test - stage Xcode project only
        if: ${{ !inputs.export_ipa }}
        shell: bash
        run: |-
          set -euo pipefail
          test -d build-ios/iOS
          mkdir -p dist
          mv build-ios/iOS dist/Xcode-project

      - name: Sign IPA and upload to TestFlight
        if: ${{ inputs.export_ipa }}
        shell: bash
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8_BASE64: ${{ secrets.ASC_P8_BASE64 }}
        run: bash "$RUNNER_TEMP/secure-ci/scripts/ios-sign-upload.sh" build-ios/iOS

      - name: Encrypt build outputs using public age recipient
        shell: bash
        run: bash "$RUNNER_TEMP/secure-ci/scripts/pack.sh" dist "encrypted/ios-${{ github.run_id }}.tar.age" ci/ci/artifact-recipient.txt

      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@v4
        with:
          name: ios-sealed-${{ github.run_id }}
          path: encrypted/*.tar.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
