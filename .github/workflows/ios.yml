name: Unity IOS - sealed output and private logs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private source ref or commit SHA'
        type: string
        required: true
        default: main
      export_ipa:
        description: 'Sign IPA and upload to App Store Connect'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: simple-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        github.repository == vars.CI_REPOSITORY &&
        vars.SOURCE_REPOSITORY == 'Goose-Egg-Studio/Simple' &&
        contains(fromJSON(vars.ALLOWED_BUILD_ACTORS || '[]'), github.actor) &&
        contains(fromJSON(vars.ALLOWED_BUILD_ACTORS || '[]'), github.triggering_actor)
      }}
    runs-on: macos-26-intel
    timeout-minutes: 180
    environment: ios-build
    steps:
      - name: Checkout public CI launcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false

      - name: Create private log directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/simple-private-logs"
          printf 'Platform: ios\nRun: %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/simple-private-logs/build-status.txt"

      - name: Verify Xcode compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/simple-private-logs"
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          {
            test -d "$DEVELOPER_DIR"
            xcodebuild -version
            xcodebuild -version | grep -Fxq 'Xcode 26.6'
          } > "$RUNNER_TEMP/simple-private-logs/xcode-setup.log" 2>&1
      - name: Validate selected private source ref
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          python3 ci/ci/validate-source-ref.py --ref "$SOURCE_REF"

      - name: Install encryption tools
        shell: bash
        run: |
          set -euo pipefail
          brew install age >/dev/null 2>&1 || { echo 'crypto tool installation failed'; exit 1; }

      # Install the external GameCI tool before placing decrypted CI code,
      # application source or any App token on this runner filesystem.
      - name: Install GameCI CLI privately (pinned installer)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/game-ci-installer"
          LOG="$RUNNER_TEMP/simple-private-logs/gameci-install.log"
          mkdir -p "$ROOT/scripts" "$RUNNER_TEMP/simple-private-logs"
          {
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/game-ci/cli/a9d35fd6cfae06bc130dcd49a48ccb8509197e38/scripts/install.sh" \
              --output "$ROOT/scripts/install.sh"
            export GAME_CI_INSTALL="$RUNNER_TEMP/game-ci/bin"
            bash "$ROOT/scripts/install.sh" "v0.1.48" "$GAME_CI_INSTALL"
            test -x "$GAME_CI_INSTALL/game-ci"
            "$GAME_CI_INSTALL/game-ci" --help >/dev/null 2>&1
          } >"$LOG" 2>&1 || { echo 'GameCI CLI installation failed; see encrypted diagnostics'; exit 1; }
          echo "$RUNNER_TEMP/game-ci/bin" >> "$GITHUB_PATH"
          echo 'GameCI CLI installed.'

      - name: Unseal CI implementation
        shell: bash
        env:
          CI_AGE_IDENTITY: ${{ secrets.CI_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/simple-ci-private-age-identity"
          TMP="$RUNNER_TEMP/simple-ci-private-scripts.tar.gz"
          trap 'rm -f "$KEY" "$TMP"' EXIT
          test -n "$CI_AGE_IDENTITY" || { echo 'CI identity missing'; exit 1; }
          printf '%s\n' "$CI_AGE_IDENTITY" > "$KEY"
          mkdir -p "$RUNNER_TEMP/secure-ci"
          age -d -i "$KEY" -o "$TMP" ci/ci/sealed/secure-ci-scripts.tar.age > "$RUNNER_TEMP/simple-private-logs/ci-unseal.log" 2>&1 || { echo 'sealed CI could not be unlocked'; exit 1; }
          python3 ci/ci/safe-extract.py --archive "$TMP" --destination "$RUNNER_TEMP/secure-ci" > "$RUNNER_TEMP/simple-private-logs/ci-extract.log" 2>&1 || { echo 'sealed CI could not be extracted'; exit 1; }
          test -x "$RUNNER_TEMP/secure-ci/scripts/checkout-source.sh"

      - name: Generate read-only source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Checkout private Unity source silently
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          umask 077
          bash "$RUNNER_TEMP/secure-ci/scripts/checkout-source.sh" > "$RUNNER_TEMP/simple-private-logs/source-checkout.log" 2>&1 || { echo 'private checkout failed; encrypted diagnostics will be provided'; exit 1; }

      - name: Validate project without public source details
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/secure-ci/scripts/validate-simple.sh" project > "$RUNNER_TEMP/simple-private-logs/source-validation.log" 2>&1
          bash "$RUNNER_TEMP/secure-ci/scripts/check-version.sh" project 2022.3.62f3 >> "$RUNNER_TEMP/simple-private-logs/source-validation.log" 2>&1

      - name: Build privately and retain diagnostics
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSE_BASE64: ${{ secrets.UNITY_LICENSE_BASE64 }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          SIMPLE_CI_LOG_DIR: ${{ runner.temp }}/simple-private-logs
          EXPORT_IPA: ${{ inputs.export_ipa }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8_BASE64: ${{ secrets.ASC_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${UNITY_LICENSE_BASE64:-}" ]; then
            UNITY_LICENSE="$(
              python3 - <<'PY_LICENSE' 2>"$RUNNER_TEMP/simple-private-logs/license-prep.log"
          import base64
          import os
          import sys
          import xml.etree.ElementTree as ET
          
          try:
              raw = base64.b64decode(os.environ["UNITY_LICENSE_BASE64"].strip(), validate=True)
              ET.fromstring(raw)
              sys.stdout.write(raw.decode("utf-8-sig"))
          except Exception as exc:
              print(f"Unity license Base64 preparation failed: {type(exc).__name__}", file=sys.stderr)
              sys.exit(1)
          PY_LICENSE
            )" || { echo 'Unity license preparation failed; see encrypted diagnostics'; exit 1; }
            export UNITY_LICENSE
          fi
          unset UNITY_LICENSE_BASE64
          if ! python3 -u ci/ci/safe-progress.py \
              --platform ios \
              --log "$RUNNER_TEMP/simple-private-logs/unity-build.log" \
              --health-log "$RUNNER_TEMP/simple-private-logs/health-ios.jsonl" \
              --heartbeat 60 --max-no-phase 7200 --max-no-output 2700 \
              --min-free-gib 1.5 -- \
              bash "$RUNNER_TEMP/secure-ci/scripts/cli-build-ios.sh"; then
            echo 'iOS build failed; encrypted diagnostics available.'
            exit 1
          fi

      # Always upload an encrypted bundle, even if source checkout or Unity fails.
      # A hard runner shutdown, cancellation, or inability to install age is not recoverable.
      - name: Encrypt outputs and private logs (success or failure)
        if: always()
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/simple-private-logs" encrypted
          printf 'Finalizer started; job status: %s\n' "${{ job.status }}" >> "$RUNNER_TEMP/simple-private-logs/build-status.txt"
          test -x "$(command -v age)" || { echo 'artifact encryption tool unavailable'; exit 1; }
          # Capture Unity's persistent Editor.log, if it exists, inside the encrypted bundle.
          for f in "$HOME/Library/Logs/Unity/Editor.log" "$HOME/.config/unity3d/Editor.log"; do
            if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/simple-private-logs/editor.log"; fi
          done
          python3 - <<'PY_TAR' | age -r "$(cat ci/ci/artifact-recipient.txt)" -o "encrypted/ios-${{ github.run_id }}.tar.age"
          import os, sys, tarfile
          home = os.environ['RUNNER_TEMP']
          workspace = os.environ['GITHUB_WORKSPACE']
          logs = os.path.join(home, 'simple-private-logs')
          artifacts = os.path.join(workspace, 'dist')
          with tarfile.open(fileobj=sys.stdout.buffer, mode='w|') as tf:
              tf.add(logs, arcname='private-logs')
              if os.path.isdir(artifacts):
                  tf.add(artifacts, arcname='build-outputs')
          PY_TAR
          test -s "encrypted/ios-${{ github.run_id }}.tar.age" || exit 1
          echo 'Encrypted diagnostics and available outputs sealed.'

      - name: Upload encrypted package only
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-sealed-${{ github.run_id }}
          path: encrypted/*.tar.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
